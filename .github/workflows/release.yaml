on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goversion: go.mod
          project_path: ./cmd/tvbeat-ssh
          binary_name: tvbeat-ssh
          # stable names, so README links to releases/latest/download/... work
          asset_name: tvbeat-ssh-${{ matrix.goos }}-${{ matrix.goarch }}
          ldflags: -s -w -X main.version=${{ github.ref_name }}
          md5sum: false
          sha256sum: true
