Host dev0-hetz+*.node
  LocalCommand [ -f ~/.cache/tvbeat/.vault-token ] && bash -c "scp -q -o PermitLocalCommand=no ~/.cache/tvbeat/.vault-token %r@%n:; rm ~/.cache/tvbeat/.vault-token;"
  PermitLocalCommand yes

Host dev0-hetz alpha0-hetz stage0-hetz prod0-hetz
  HostName jump.%h.tvbeat.com
  IdentityFile ~/.cache/tvbeat/.ssh/id_ed25519
  Port 443
  User dave

Match host *+* exec "tvbeat-ssh sign --role all"
  IdentityFile ~/.cache/tvbeat/.ssh/id_ed25519
  ProxyCommand bash -c "ssh -l dave -W $(echo %h | sed 's/^.*+//;s/^\([^:]*$\)/\1:22/') $(echo %h | sed 's/+[^+]*$//;s/\([^+%%]*\)%%\([^+]*\)$/\2 -l \1/;s/:\([^:+]*\)$/ -p \1/')"
  User dave

Match host jump.*.tvbeat.com exec "tvbeat-ssh sign --role all"
  IdentityFile ~/.cache/tvbeat/.ssh/id_ed25519
  Port 443
  User dave
